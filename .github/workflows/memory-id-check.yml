name: Memory ID collision check

on:
  pull_request:
    paths:
      - 'memory/CONTEXT.md'
      - 'memory/DECISIONS.md'
      - 'memory/SESSIONS.md'
      - 'memory/DECISIONS-ARCHIVE/**'
      - 'memory/SESSIONS-ARCHIVE/**'
      - 'scripts/check-memory-ids.sh'
      - '.github/workflows/memory-id-check.yml'
  push:
    paths:
      - 'memory/CONTEXT.md'
      - 'memory/DECISIONS.md'
      - 'memory/SESSIONS.md'
      - 'memory/DECISIONS-ARCHIVE/**'
      - 'memory/SESSIONS-ARCHIVE/**'
      - 'scripts/check-memory-ids.sh'
      - '.github/workflows/memory-id-check.yml'

jobs:
  check-duplicate-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for duplicate or reused DEC-/SESS-/ITEM- IDs
        # The CAMP template repo carries this file at the path projects need,
        # so GitHub runs it there too, and the template has no memory files.
        # A repo with none of the three skips; every project has them.
        run: |
          if [ ! -e memory/DECISIONS.md ] && [ ! -e memory/SESSIONS.md ] && [ ! -e memory/CONTEXT.md ]; then
            echo "No memory/DECISIONS.md, SESSIONS.md or CONTEXT.md here (the CAMP template repo itself): nothing to check."
            exit 0
          fi
          bash scripts/check-memory-ids.sh memory
