name: Memory ID collision check

on:
  pull_request:
    paths:
      - 'memory/CONTEXT.md'
      - 'memory/DECISIONS.md'
      - 'memory/SESSIONS.md'
      - 'memory/DECISIONS-ARCHIVE/**'
      - 'memory/SESSIONS-ARCHIVE/**'
      - 'scripts/check-memory-ids.sh'
  push:
    paths:
      - 'memory/CONTEXT.md'
      - 'memory/DECISIONS.md'
      - 'memory/SESSIONS.md'
      - 'memory/DECISIONS-ARCHIVE/**'
      - 'memory/SESSIONS-ARCHIVE/**'
      - 'scripts/check-memory-ids.sh'

jobs:
  check-duplicate-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for duplicate or reused DEC-/SESS-/ITEM- IDs
        run: bash scripts/check-memory-ids.sh memory
